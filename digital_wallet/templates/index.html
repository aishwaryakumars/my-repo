<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DigiWallet</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#f3f5f9;
}

.header{
background:linear-gradient(135deg,#5f259f,#7b3fe4);
color:white;
padding:25px;
border-bottom-left-radius:30px;
border-bottom-right-radius:30px;
box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.header h1{
font-size:28px;
}

.balance-card{
background:white;
margin:20px;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.balance-card h2{
color:#5f259f;
font-size:32px;
}

.actions{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
padding:20px;
}

.action{
background:white;
padding:15px;
border-radius:15px;
text-align:center;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,.1);
transition:.3s;
}

.action:hover{
transform:translateY(-5px);
}

.action i{
font-size:24px;
color:#5f259f;
margin-bottom:10px;
}

.section{
background:white;
margin:20px;
padding:20px;
border-radius:20px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.section h3{
margin-bottom:15px;
color:#5f259f;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:12px;
background:#5f259f;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

button:hover{
background:#4d1e82;
}

#transactions,
#notifications,
#networkResult{
margin-top:15px;
padding:10px;
background:#f8f8f8;
border-radius:10px;
max-height:250px;
overflow:auto;
}

.transaction-item{
padding:10px;
border-bottom:1px solid #ddd;
}

.hidden{
display:none;
}

@media(max-width:700px){

.actions{
grid-template-columns:repeat(2,1fr);
}

}

</style>
</head>
<body>

<div class="header">
<h1><i class="fa-solid fa-wallet"></i> DigiWallet</h1>
<p>Fast • Secure • Smart Payments</p>
</div>

<div class="balance-card">
<p>Current Balance</p>
<h2 id="balance">₹0</h2>
</div>

<div class="actions">

<div class="action" onclick="showSection('addMoney')">
<i class="fa-solid fa-plus"></i>
<p>Add Money</p>
</div>

<div class="action" onclick="showSection('transfer')">
<i class="fa-solid fa-paper-plane"></i>
<p>Transfer</p>
</div>

<div class="action" onclick="showSection('requests')">
<i class="fa-solid fa-hand-holding-dollar"></i>
<p>Request</p>
</div>

<div class="action" onclick="showSection('network')">
<i class="fa-solid fa-diagram-project"></i>
<p>BFS Network</p>
</div>

</div>

<!-- Add Money -->

<div class="section hidden" id="addMoney">

<h3>Add Money</h3>

<input id="addEmail" placeholder="Email">

<input id="addAmount" placeholder="Amount">

<button onclick="addMoney()">
Add Money
</button>

</div>

<!-- Transfer -->

<div class="section hidden" id="transfer">

<h3>Transfer Money</h3>

<input id="sender" placeholder="Sender Email">

<input id="receiver" placeholder="Receiver Email">

<input id="transferAmount" placeholder="Amount">

<button onclick="transferMoney()">
Transfer
</button>

</div>

<!-- Requests -->

<div class="section hidden" id="requests">

<h3>Payment Request</h3>

<input id="requester" placeholder="Requester Email">

<input id="payer" placeholder="Payer Email">

<input id="requestAmount" placeholder="Amount">

<button onclick="requestMoney()">
Request Money
</button>

</div>

<!-- BFS -->

<div class="section hidden" id="network">

<h3>BFS Transaction Network</h3>

<input id="bfsSender" placeholder="Sender Email">

<input id="bfsReceiver" placeholder="Receiver Email">

<button onclick="findPath()">
Find Path
</button>

<div id="networkResult"></div>

</div>

<!-- Transactions -->

<div class="section">

<h3>
<i class="fa-solid fa-clock-rotate-left"></i>
Transactions
</h3>

<input id="historyEmail"
placeholder="Enter Email">

<button onclick="loadTransactions()">
Load History
</button>

<div id="transactions"></div>

</div>

<!-- Notifications -->

<div class="section">

<h3>
<i class="fa-solid fa-bell"></i>
Notifications
</h3>

<input id="notifyEmail"
placeholder="Enter Email">

<button onclick="loadNotifications()">
Load Notifications
</button>

<div id="notifications"></div>

</div>

<script>

const API = "";

function showSection(id){

document.querySelectorAll('.hidden')
.forEach(x=>x.style.display='none');

document.getElementById(id)
.style.display='block';

}

async function addMoney(){

let res=await fetch(`${API}/add-money`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:addEmail.value,

amount:Number(addAmount.value)

})

});

alert((await res.json()).message);

}

async function transferMoney(){

let res=await fetch(`${API}/transfer`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

sender_email:sender.value,

receiver_email:receiver.value,

amount:Number(transferAmount.value)

})

});

alert((await res.json()).message);

}

async function requestMoney(){

let res=await fetch(`${API}/request-money`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

requester_email:requester.value,

payer_email:payer.value,

amount:Number(requestAmount.value)

})

});

alert((await res.json()).message);

}

async function loadTransactions(){

let email=
document.getElementById("historyEmail").value;

let res=
await fetch(`${API}/transactions/${email}`);

let data=
await res.json();

transactions.innerHTML="";

data.transactions.forEach(t=>{

transactions.innerHTML+=`
<div class="transaction-item">
${JSON.stringify(t)}
</div>
`;

});

}

async function loadNotifications(){

let email=
document.getElementById("notifyEmail").value;

let res=
await fetch(`${API}/notifications/${email}`);

let data=
await res.json();

notifications.innerHTML="";

data.forEach(n=>{

notifications.innerHTML+=`
<div class="transaction-item">
${n.message}
</div>
`;

});

}

async function findPath(){

let senderEmail=
bfsSender.value;

let receiverEmail=
bfsReceiver.value;

let res=
await fetch(
`${API}/transaction-network?sender_email=${senderEmail}&receiver_email=${receiverEmail}`
);

let data=
await res.json();

networkResult.innerHTML=
`<pre>${JSON.stringify(data,null,2)}</pre>`;

}

</script>

</body>
</html>
